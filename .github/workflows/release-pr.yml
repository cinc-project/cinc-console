name: release-pr

# Step 1 of 2 in cutting a release. Opens (or refreshes) a PR that bumps every
# version reference in the repo and adds the CHANGELOG section. Merging that PR
# is what actually releases — see tag-release.yml.
#
# The bump lands in the commit that gets tagged, which is the whole point: the
# image build checks out the tag, so it cannot see a stale version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, no leading "v" (e.g. 0.5.0)
        required: true
        type: string

permissions:
  contents: write # push the release/<version> branch
  pull-requests: write # open the release PR

jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # changelog.mjs needs tags and full history

      # Inputs go through env, never string-interpolated into the shell.
      # set-version.mjs also rejects anything that is not bare semver, so a bad
      # input fails here — before any branch or PR exists.
      - name: Bump version references and write the CHANGELOG section
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/set-version.mjs "$VERSION"
          node scripts/changelog.mjs "$VERSION"

      - name: Open or refresh the release PR
        env:
          # Prefer RELEASE_PR_TOKEN (a PAT or GitHub App token) when it exists.
          # Two reasons, both about GITHUB_TOKEN's limits rather than permissions:
          #
          #  1. PR creation by GITHUB_TOKEN is gated by a separate repo/org
          #     setting -- Settings > Actions > General > "Allow GitHub Actions to
          #     create and approve pull requests" -- which `pull-requests: write`
          #     does not satisfy. Off by default; createPullRequest is refused.
          #  2. Events triggered by GITHUB_TOKEN do not start new workflow runs,
          #     so a PR it opens gets no CI. That defeats the point of reviewing
          #     the release diff with a green build on the exact tree that ships.
          #
          # A PAT/App token avoids both. Without one we degrade gracefully below.
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          USING_PAT: ${{ secrets.RELEASE_PR_TOKEN != '' }}
          VERSION: ${{ inputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/cinc-console
        run: |
          set -euo pipefail
          branch="release/$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Release $VERSION"
          # Force-push so re-running for the same version refreshes the branch
          # rather than failing on a stale one.
          git push --force origin "$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number -q '.[].number')" ]; then
            echo "Refreshed the existing PR for $branch."
            exit 0
          fi

          # Written to a file rather than inlined: an unquoted heredoc treats
          # backticks as command substitution, so the body avoids them entirely.
          cat > /tmp/pr-body.md <<EOF
          Prepares the $VERSION release.

          - package.json and the Helm chart (version + appVersion) set to $VERSION
          - CHANGELOG.md gains a $VERSION section generated from the PR titles
            merged since the last tag

          Reword the generated notes on this branch if you want to; they become
          the GitHub Release body verbatim.

          Merging this PR tags v$VERSION, publishes the GitHub Release, and builds
          $IMAGE:$VERSION from the tagged commit.
          EOF

          if gh pr create --base main --head "$branch" \
               --title "Release $VERSION" \
               --body-file /tmp/pr-body.md 2>/tmp/pr-err; then
            if [ "$USING_PAT" != "true" ]; then
              echo "::warning::PR opened with GITHUB_TOKEN, so CI will not run on it. Close and reopen the PR, or set RELEASE_PR_TOKEN."
            fi
            exit 0
          fi

          cat /tmp/pr-err >&2

          # Anything other than the settings gate is a genuine failure.
          if ! grep -q 'not permitted to create or approve pull requests' /tmp/pr-err; then
            exit 1
          fi

          # The branch and its bump commit are this job's real product, and they
          # are already pushed. Rather than fail red on a repo setting the code
          # cannot change, hand back a one-click link. A human-opened PR also gets
          # CI, which a GITHUB_TOKEN-opened one would not.
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$branch?expand=1"
          {
            echo "## Release $VERSION — one manual step needed"
            echo
            echo "Branch \`$branch\` is pushed with the version bump and CHANGELOG."
            echo "GitHub refused to let Actions open the PR, so open it yourself:"
            echo
            echo "### [→ Open the release PR]($compare)"
            echo
            echo "To make this fully automatic, either:"
            echo
            echo "- enable **Settings → Actions → General → Workflow permissions →"
            echo "  \"Allow GitHub Actions to create and approve pull requests\"**, or"
            echo "- add a \`RELEASE_PR_TOKEN\` secret (PAT or GitHub App token with"
            echo "  \`contents: write\` + \`pull-requests: write\`)."
            echo
            echo "The token is the better option: a PR opened by \`GITHUB_TOKEN\` gets"
            echo "no CI run, because events it triggers do not start workflows."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning::Branch pushed, but Actions is not permitted to open PRs. See the run summary for a one-click link."
