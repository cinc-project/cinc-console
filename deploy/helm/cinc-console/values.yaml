# Default values for cinc-console.

replicaCount: 2

image:
  repository: ghcr.io/tas50/cinc-console
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Connection to the Cinc/Chef Infra Server.
cincServerUrl: "" # e.g. https://chef.example.com  (REQUIRED)
# Skip TLS verification of the cinc server (dev only).
sslNoVerify: false
# Session cookie lifetime in seconds (default 8h).
sessionTtlSeconds: 28800
# Node environment (production or development). In production, secure cookies are used.
# In development, cookies are insecure (http). Set to development to debug session issues.
nodeEnv: "production"
# Secure flag on the session cookie. Leave empty to follow nodeEnv (on in
# production, off in development) — correct for any HTTPS deployment, including
# behind an Ingress that terminates TLS. Set to false ONLY for a deliberate
# plain-HTTP deployment: the flag is never inferred from request headers, because
# X-Forwarded-Proto is attacker-supplied unless every path to the pod strips it.
cookieSecure: ""
# Signing actor for POST /authenticate_user. This endpoint is global (non-org)
# and its ACL only grants "create" to globally-privileged actors. Set this to
# "pivotal" (or another global admin) so the webui-signed request is accepted.
# Leave empty to sign as the authenticating user (works only if that user has
# global create permission, which org users typically do not).
authActor: "pivotal"

# -- Secrets. Provide the webui key here, or point existingSecret at a
# pre-created Secret that holds CINC_WEBUI_KEY, SESSION_SECRET, and
# optionally CINC_CA_CERT.
webuiKey: "" # contents of webui_priv.pem (REQUIRED unless existingSecret set)
# A PEM CA bundle to trust for a self-signed cinc server (optional).
caCert: ""
# 32+ char secret used to encrypt the session cookie. Generated if empty.
sessionSecret: ""
# Use an externally-managed Secret instead of the values above.
existingSecret: ""

service:
  type: ClusterIP # ClusterIP, NodePort, LoadBalancer
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: cinc-console.example.com
  tls: [] # e.g. [{ secretName: cinc-console-tls, hosts: [cinc-console.example.com] }]

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
